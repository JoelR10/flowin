<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>05 — Metas y OKR Personal · Coach Suite</title>
<style>
:root{
  --bg:#0b0e14; --bg2:#0d1117; --card:#151b24; --card2:#1b222d; --line:#262e3a;
  --txt:#e6edf3; --mut:#8b97a7; --mut2:#5d6776;
  --accent:#6aa6ff; --accent-soft:rgba(106,166,255,.14);
  --green:#3fb950; --yellow:#d8a236; --red:#f3604b;
  --radius:16px; --sh:0 10px 30px rgba(0,0,0,.35);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 700px at 85% -10%,rgba(106,166,255,.07),transparent 60%),
     radial-gradient(900px 600px at -10% 110%,var(--accent-soft),transparent 55%),var(--bg);
     color:var(--txt);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.45}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.badge{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent);flex:none}
.htitle{display:flex;flex-direction:column;gap:3px}
.htitle .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);font-weight:600}
.htitle h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.areachip{font-size:12px;color:var(--accent);background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);padding:3px 9px;border-radius:999px;font-weight:600}
.spacer{flex:1}
.livebox{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:8px 14px;box-shadow:var(--sh)}
.livebox .num{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.livebox .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.sem-green{color:var(--green)} .sem-yellow{color:var(--yellow)} .sem-red{color:var(--red)}
.bg-green{background:var(--green)} .bg-yellow{background:var(--yellow)} .bg-red{background:var(--red)}
.subtitle{color:var(--mut);font-size:13.5px;margin:0 0 18px;max-width:760px}
/* layout */
.shell{display:grid;grid-template-columns:208px 1fr;gap:20px;align-items:start}
.nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:4px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--sh)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;
  border:0;color:var(--mut);font:inherit;font-size:14px;font-weight:600;padding:10px 12px;border-radius:11px;cursor:pointer;transition:.15s}
.nav button .ic{font-size:16px;width:20px;text-align:center}
.nav button:hover{background:var(--card2);color:var(--txt)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.view{min-width:0;display:flex;flex-direction:column;gap:16px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--sh)}
.card h2{margin:0 0 3px;font-size:15px;font-weight:700}
.card .hint{color:var(--mut);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:13px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:23px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .m{font-size:11.5px;color:var(--mut2)}
.kpi .lec{font-size:11.5px;color:var(--accent);margin-top:6px}
/* resumen hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.gauge{width:148px;height:148px;flex:none}
.gauge circle{fill:none;stroke-width:11;stroke-linecap:round}
.gauge .bg{stroke:var(--card2)}
.gauge .fg{transition:stroke-dashoffset .6s ease, stroke .3s}
.gwrap{position:relative;width:148px;height:148px}
.gtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gtext .n{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.gtext .s{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.callout{border-radius:13px;padding:14px 16px;border:1px solid var(--line);background:var(--card2)}
.callout .nivel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.callout h3{margin:5px 0 6px;font-size:16px}
.callout p{margin:0;color:var(--mut);font-size:13.5px}
.estado-pill{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;
  padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);margin-top:10px}
/* table */
.tablebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{background:var(--accent);color:#06101f;border:0;font:inherit;font-weight:700;font-size:13px;
  padding:9px 14px;border-radius:10px;cursor:pointer;transition:.15s;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--line)}
.btn.sm{padding:6px 10px;font-size:12px}
.tscroll{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
thead th{position:sticky;top:0;background:var(--card2);color:var(--mut);text-align:left;font-weight:600;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
tbody td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.015)}
tbody input,tbody select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  font:inherit;font-size:13px;padding:7px 8px;border-radius:8px;min-width:78px}
tbody input:focus,tbody select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
td.calc{font-weight:700;font-variant-numeric:tabular-nums;color:var(--txt);white-space:nowrap}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.green{background:rgba(63,185,80,.15);color:var(--green)}
.chip.yellow{background:rgba(216,162,54,.16);color:var(--yellow)}
.chip.red{background:rgba(243,96,75,.15);color:var(--red)}
.del{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;cursor:pointer;
  width:30px;height:30px;font-size:15px;line-height:1}
.del:hover{border-color:var(--red);color:var(--red)}
/* config */
.cfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  font:inherit;padding:10px 11px;border-radius:10px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.field .fh{font-size:11.5px;color:var(--mut2);margin-top:5px}
/* motor / alerts / guia */
.mrow,.arow{display:grid;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}
.mrow{grid-template-columns:120px 1fr 64px}
.mrow:last-child,.arow:last-child{border-bottom:0}
.mrow .vbl{font-weight:700}.mrow .fml{color:var(--mut);font-size:13px}
.mrow .peso{font-weight:800;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.arow{grid-template-columns:84px 1fr auto}
.arow .nv{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;align-self:center}
.arow .body h4{margin:0 0 3px;font-size:14px}
.arow .body p{margin:0;color:var(--mut);font-size:13px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:11px}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.step .n{counter-increment:s;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  font-weight:800;display:grid;place-items:center;font-size:14px}
.step .n::before{content:counter(s)}
.step p{margin:0;font-size:13.5px;color:var(--txt)}
.exp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 14px}
.exp .e{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.exp .e .k{font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em}
.exp .e .v{font-size:13.5px;font-weight:700;margin-top:3px;word-break:break-word}
.row-actions{display:flex;gap:9px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--accent);color:#06101f;font-weight:700;padding:11px 18px;border-radius:11px;box-shadow:var(--sh);
  transition:.25s;pointer-events:none;z-index:50;font-size:13.5px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin-top:26px;text-align:center;color:var(--mut2);font-size:12px}
.foot a{color:var(--accent)}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .nav{position:static;flex-direction:row;overflow:auto;padding:6px}
  .nav button{flex:none;white-space:nowrap}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .livebox{order:3}
}
</style></head><body><div id="app"></div>
<script>window.SPEC={"num": "05", "id": "COACH_METAS", "area": "Metas", "title": "Metas y OKR Personal", "icon": "🎯", "accent": "#7c83ff", "subtitle": "OKRs y metas personales con porcentaje de avance, días restantes y semáforo. Evita la dispersión limitando las metas activas.", "thresholds": {"green": 75, "yellow": 40}, "estados": {"green": "🟢 En camino", "yellow": "🟡 Avance bajo", "red": "🔴 En riesgo"}, "entryNoun": "meta", "config": [{"key": "maxActivas", "label": "Máx metas activas", "type": "number", "value": 5, "hint": "3–7"}, {"key": "umbralAvance", "label": "Umbral avance bueno (%)", "type": "number", "value": 75, "hint": "60–85"}, {"key": "diasAlerta", "label": "Días alerta vencimiento", "type": "number", "value": 7, "hint": "3–14"}], "columns": [{"key": "ID", "label": "ID", "type": "text", "role": "input"}, {"key": "Área", "label": "Área", "type": "text", "role": "input"}, {"key": "Meta", "label": "Meta", "type": "text", "role": "input"}, {"key": "Tipo", "label": "Tipo", "type": "select", "role": "input", "options": ["Resultado", "Proceso", "Negocio", "Aprendizaje", "Personal"]}, {"key": "Fecha_Inicio", "label": "Inicio", "type": "date", "role": "input"}, {"key": "Fecha_Límite", "label": "Límite", "type": "date", "role": "input"}, {"key": "Métrica_Actual", "label": "Actual", "type": "number", "role": "input"}, {"key": "Métrica_Meta", "label": "Meta", "type": "number", "role": "input"}, {"key": "Unidad", "label": "Unidad", "type": "text", "role": "input"}, {"key": "Prioridad", "label": "Prioridad", "type": "select", "role": "input", "options": ["Alta", "Media", "Baja"]}, {"key": "Estado", "label": "Estado", "type": "select", "role": "input", "options": ["Activa", "En curso", "Bloqueada", "Hecha", "Cancelada"]}, {"key": "Próxima_Acción", "label": "Próxima acción", "type": "text", "role": "input"}, {"key": "Nota", "label": "Nota", "type": "text", "role": "input"}, {"key": "%_Avance", "label": "% Avance", "type": "calc", "role": "calc"}, {"key": "Días_Restantes", "label": "Días rest.", "type": "calc", "role": "calc"}, {"key": "Semáforo", "label": "Semáforo", "type": "calc", "role": "calc"}], "motor": [["Avance", "% Avance", "Métrica actual / métrica meta", "★", "Mide el progreso real"], ["Tiempo", "Días restantes", "Fecha límite − hoy", "—", "Detecta presión temporal"], ["Semáforo", "Vencida", "Días restantes < 0", "🔴", "Meta sin cerrar"], ["Semáforo", "Bloqueada", "Estado = Bloqueada", "🔴", "Hay un impedimento"], ["Enfoque", "Metas activas", "Cuenta de estados activos", "—", "Evita dispersión"]], "guide": ["Definí pocas metas con métrica y fecha límite.", "Actualizá Métrica_Actual cada semana.", "Revisá vencidas y bloqueadas en Alertas.", "Congelá metas de baja prioridad si pasás el máximo.", "Usá la fila Export para reportar avance."], "claude": "COACH_METAS · Metas. Entradas: metas con métrica actual/meta, fecha límite, prioridad y estado. Calcula % de avance, días restantes y semáforo. Prioriza metas vencidas y bloqueadas; si el avance promedio es bajo, propone partir metas grandes en tareas semanales. Recordá el límite de metas activas para mantener foco."};
SPEC.seed=[];
SPEC.scoreEntry=function(e,c){
 var act=H.N(e['Métrica_Actual']),meta=H.N(e['Métrica_Meta']);
 var av=meta>0?H.CLAMP(act/meta,0,1.5):0, avc=Math.min(av,1);
 var lim=H.PD(e['Fecha_Límite']), dr=lim?H.DAYS(lim,H.TODAY()):null;
 var st=e['Estado']||'', done=st==='Hecha', canc=st==='Cancelada';
 var venc=(dr!=null&&dr<0)&&!done&&!canc, blq=st==='Bloqueada';
 var umb=(H.N(c.umbralAvance)||75)/100;
 var sem=done?'green':(venc||blq)?'red':avc>=umb?'green':avc>=0.4?'yellow':'red';
 return {score:avc*100,semaforo:sem,_active:!done&&!canc,_venc:venc,_blq:blq,calc:{
   '%_Avance':H.R(avc*100)+'%','Días_Restantes':dr==null?'—':dr,'Semáforo':sem==='green'?'🟢':sem==='yellow'?'🟡':'🔴'}};
 };
SPEC.aggregate=function(L,c){
 var act=L.filter(function(e){return e._s._active;}), n=act.length;
 var avg=n?act.reduce(function(a,e){return a+Math.min(e._s.score,100);},0)/n:0;
 var venc=L.filter(function(e){return e._s._venc;}).length;
 var blq=L.filter(function(e){return e._s._blq&&e._s._active;}).length;
 var green=act.filter(function(e){return e._s.semaforo==='green';}).length;
 var maxA=H.N(c.maxActivas)||5;
 var al=[H.alert('Alta','Vencimiento',venc>0,venc+' meta(s) vencida(s)','Revisá las vencidas: cerrá, replanteá o cancelá cada una.'),
   H.alert('Alta','Bloqueos',blq>0,blq+' meta(s) bloqueada(s)','Definí el desbloqueo exacto y una sola acción para hoy.'),
   H.alert('Media','Carga',n>maxA,'Demasiadas metas activas ('+n+')','Congelá las de baja prioridad para no dispersarte.'),
   H.alert('Media','Avance',avg<40,'Avance promedio bajo','Convertí las metas grandes en tareas semanales medibles.')];
 return {puntaje:avg,recoOK:'Buen ritmo: actualizá métricas cada semana.',kpis:[
   {label:'Avance promedio',value:H.R(avg)+'%',meta:'meta ≥ '+(H.N(c.umbralAvance)||75)+'%'},
   {label:'Metas activas',value:n,meta:'máx '+maxA},
   {label:'En camino',value:green,meta:'de '+n},
   {label:'Vencidas',value:venc,lec:venc?'Resolver ya':'OK'},
   {label:'Bloqueadas',value:blq,lec:blq?'Desbloquear':'OK'},
   {label:'Total metas',value:L.length}],alertas:al};
 };
SPEC.blank=function(){var t=new Date().toISOString().slice(0,10);var d=new Date();d.setDate(d.getDate()+30);return {'ID':'M-00','Estado':'Activa','Prioridad':'Media','Tipo':'Resultado','Fecha_Inicio':t,'Fecha_Límite':d.toISOString().slice(0,10),'Métrica_Actual':0,'Métrica_Meta':1};};
</script><script>
(function(){
  const S = window.SPEC;
  const KEY = 'flowin_coach_v1_'+S.num;
  const $ = (s,e=document)=>e.querySelector(s);
  const H = {
    N:v=>{v=parseFloat(v);return isNaN(v)?0:v;},
    YES:v=>v===true||['sí','si','yes','x','1','true'].includes(String(v==null?'':v).trim().toLowerCase()),
    TODAY:()=>{const d=new Date();d.setHours(0,0,0,0);return d;},
    PD:s=>{if(!s)return null;const d=new Date(s);if(isNaN(d))return null;d.setHours(0,0,0,0);return d;},
    DAYS:(a,b)=>Math.round((a-b)/86400000),
    CLAMP:(x,a,b)=>Math.max(a,Math.min(b,x)),
    R:x=>Math.round(x),
    alert:(nivel,area,active,msg,reco)=>({nivel,area,active,reco,
      result:active?((nivel==='Alta'?'🔴 ':'🟡 ')+msg):'🟢 OK'})
  };
  window.H=H;
  const isoToday = new Date().toISOString().slice(0,10);

  let state = load();
  function load(){
    try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); if(o&&o.entries) return o;}}catch(e){}
    const cfg={}; S.config.forEach(c=>cfg[c.key]=c.value);
    return {cfg, entries:JSON.parse(JSON.stringify(S.seed||[]))};
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  function enrichOne(e){const s=S.scoreEntry(e,state.cfg)||{};return Object.assign({},e,{_s:s});}
  function compute(){
    const L=state.entries.map(enrichOne);
    const agg=S.aggregate(L,state.cfg)||{puntaje:0,kpis:[],alertas:[]};
    const est=estadoOf(agg.puntaje);
    const fired=(agg.alertas||[]).filter(a=>a.active).sort((a,b)=>(a.nivel==='Alta'?0:1)-(b.nivel==='Alta'?0:1));
    const top=fired[0];
    const exportRow={
      COACH_ID:S.id, AREA:S.area, FECHA_CORTE:isoToday, PUNTAJE:H.R(agg.puntaje),
      ESTADO:est.label, ALERTA: top? (top.area+': '+top.result) : '🟢 Sin alertas activas',
      RECOMENDACION: top? top.reco : (agg.recoOK||'Mantener el ritmo actual.'),
      ULTIMA_ACTUALIZACION:isoToday, VERSION:'v1.0'
    };
    return {L,agg,est,fired,top,exportRow};
  }
  function estadoOf(p){
    const t=S.thresholds||{green:75,yellow:55};
    const es=S.estados||{green:'🟢 Sólido',yellow:'🟡 Atención',red:'🔴 Crítico'};
    if(p>=t.green)return{label:es.green,sem:'green'};
    if(p>=t.yellow)return{label:es.yellow,sem:'yellow'};
    return{label:es.red,sem:'red'};
  }

  let view='resumen';
  const NAV=[['resumen','📊','Resumen'],['config','⚙️','Configuración'],['entradas','📝','Entradas'],
             ['motor','🧮','Motor'],['alertas','🚦','Alertas'],['guia','📘','Guía']];

  function render(){
    document.body.style.setProperty('--accent',S.accent);
    document.title=S.num+' — '+S.title+' · Coach Suite';
    const c=compute();try{if(window.parent&&window.parent!==window)window.parent.postMessage({__flowin:"state",payload:c.exportRow},"*");}catch(e){}
    const app=$('#app');
    app.innerHTML=`
      <div class="wrap">
        <div class="top">
          <div class="badge">${S.icon}</div>
          <div class="htitle">
            <span class="k">Coach ${S.num}</span>
            <h1>${S.title} <span class="areachip">${S.area}</span></h1>
          </div>
          <div class="spacer"></div>
          <div class="livebox">
            <div><div class="num" id="hScore">${H.R(c.agg.puntaje)}</div><div class="lbl">Puntaje</div></div>
            <div><span class="dot bg-${c.est.sem}"></span><span id="hEstado" class="sem-${c.est.sem}" style="font-weight:700">${c.est.label}</span></div>
          </div>
        </div>
        <p class="subtitle">${S.subtitle}</p>
        <div class="shell">
          <nav class="nav">${NAV.map(n=>`<button data-v="${n[0]}" class="${view===n[0]?'on':''}"><span class="ic">${n[1]}</span>${n[2]}</button>`).join('')}</nav>
          <section class="view" id="viewbox"></section>
        </div>
        <div class="foot">Coach Suite · los datos se guardan en este navegador</div>
      </div>
      <div class="toast" id="toast"></div>`;
    app.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
    drawView(c);
  }

  function drawView(c){
    const box=$('#viewbox');
    if(view==='resumen') box.innerHTML=vResumen(c);
    else if(view==='config'){box.innerHTML=vConfig();bindConfig();}
    else if(view==='entradas'){box.innerHTML=vEntradas(c);bindTable();}
    else if(view==='motor') box.innerHTML=vMotor();
    else if(view==='alertas') box.innerHTML=vAlertas(c);
    else if(view==='guia'){box.innerHTML=vGuia(c);bindExport(c);}
  }

  // ---------- RESUMEN ----------
  function gauge(p,sem){
    const C=2*Math.PI*52, off=C*(1-H.CLAMP(p,0,100)/100);
    const col=sem==='green'?'var(--green)':sem==='yellow'?'var(--yellow)':'var(--red)';
    return `<div class="gwrap"><svg class="gauge" viewBox="0 0 120 120">
      <circle class="bg" cx="60" cy="60" r="52"></circle>
      <circle class="fg" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"
        style="stroke:${col};stroke-dasharray:${C};stroke-dashoffset:${off}"></circle></svg>
      <div class="gtext"><div class="n">${H.R(p)}</div><div class="s">de 100</div></div></div>`;
  }
  function vResumen(c){
    const k=(c.agg.kpis||[]).map(x=>`<div class="kpi"><div class="l">${x.label}</div>
       <div class="v">${x.value}</div>${x.meta?`<div class="m">${x.meta}</div>`:''}${x.lec?`<div class="lec">${x.lec}</div>`:''}</div>`).join('');
    const t=c.top;
    const callout=`<div class="callout" style="border-color:${t?(t.nivel==='Alta'?'rgba(243,96,75,.4)':'rgba(216,162,54,.4)'):'rgba(63,185,80,.35)'}">
       <div class="nivel sem-${t?(t.nivel==='Alta'?'red':'yellow'):'green'}">${t?('⚠ Prioridad '+t.nivel+' · '+t.area):'✓ Sin alertas activas'}</div>
       <h3>${t?t.result.replace(/^🔴 |^🟡 /,''):'Todo en verde'}</h3>
       <p>${t?t.reco:(c.agg.recoOK||'Mantené el ritmo y seguí registrando.')}</p>
       <div class="estado-pill"><span class="dot bg-${c.est.sem}"></span>${c.est.label}</div></div>`;
    return `<div class="card"><div class="hero">${gauge(c.agg.puntaje,c.est.sem)}${callout}</div></div>
      <div class="card"><h2>Indicadores clave</h2><p class="hint">Calculados en vivo desde tus Entradas y tu Configuración.</p>
        <div class="grid kpis">${k||'<p class="hint">Agregá registros en Entradas para ver tus KPIs.</p>'}</div></div>
      ${expCard(c)}`;
  }
  function expCard(c){
    const e=c.exportRow;
    const cells=Object.entries(e).map(([k,v])=>`<div class="e"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
    return `<div class="card"><h2>Fila Export_Dashboard</h2>
      <p class="hint">Esta es la salida estándar que conecta este coach con el resto de la suite o con Claude.</p>
      <div class="exp">${cells}</div>
      <div class="row-actions">
        <button class="btn sm" data-exp="row">Copiar fila</button>
        <button class="btn sm ghost" data-exp="json">Descargar JSON</button>
        <button class="btn sm ghost" data-exp="csv">Descargar CSV de entradas</button>
      </div></div>`;
  }

  // ---------- CONFIG ----------
  function vConfig(){
    const f=S.config.map(c=>{
      let ctl;
      if(c.type==='select') ctl=`<select data-cfg="${c.key}">${c.options.map(o=>`<option ${String(state.cfg[c.key])===String(o)?'selected':''}>${o}</option>`).join('')}</select>`;
      else ctl=`<input data-cfg="${c.key}" type="${c.type==='number'?'number':'text'}" step="any" value="${state.cfg[c.key]}">`;
      return `<div class="field"><label>${c.label}</label>${ctl}${c.hint?`<div class="fh">${c.hint}</div>`:''}</div>`;
    }).join('');
    return `<div class="card"><h2>Configuración editable</h2>
      <p class="hint">Cambiá estos valores y el motor recalcula al instante. Equivale a la hoja <b>Configuracion</b>.</p>
      <div class="cfgrid">${f}</div></div>`;
  }
  function bindConfig(){
    $('#viewbox').querySelectorAll('[data-cfg]').forEach(el=>{
      el.addEventListener('input',()=>{state.cfg[el.dataset.cfg]=el.value;save();refreshHeader();});
    });
  }

  // ---------- ENTRADAS ----------
  function cell(i,col,e){
    if(col.role==='calc'){
      const cv=(e._s.calc||{})[col.key];
      if(col.key.toLowerCase().includes('semáforo')||col.key==='Recomendación'){
        const sem=e._s.semaforo||'green';
        const cls=(col.key==='Recomendación')?(sem):sem;
        return `<td class="calc" id="c-${i}-${cssK(col.key)}"><span class="chip ${cls}">${cv!=null?cv:'—'}</span></td>`;
      }
      return `<td class="calc" id="c-${i}-${cssK(col.key)}">${cv!=null?cv:'—'}</td>`;
    }
    const v=e[col.key]==null?'':e[col.key];
    if(col.type==='select')
      return `<td><select data-i="${i}" data-key="${escA(col.key)}">${col.options.map(o=>`<option ${String(v)===String(o)?'selected':''}>${o}</option>`).join('')}</select></td>`;
    const tp=col.type==='number'?'number':col.type==='date'?'date':'text';
    return `<td><input data-i="${i}" data-key="${escA(col.key)}" type="${tp}" ${tp==='number'?'step="any"':''} value="${escA(String(v))}"></td>`;
  }
  function vEntradas(c){
    const cols=S.columns;
    const head=cols.map(co=>`<th>${co.label}</th>`).join('')+'<th></th>';
    const body=c.L.map((e,i)=>`<tr>${cols.map(co=>cell(i,co,e)).join('')}<td><button class="del" data-del="${i}">✕</button></td></tr>`).join('');
    return `<div class="card">
      <div class="tablebar"><div><h2 style="margin:0">Entradas</h2><p class="hint" style="margin:2px 0 0">Una línea por ${S.entryNoun}. Las columnas en color son calculadas por el motor.</p></div>
        <button class="btn" data-add="1">+ Agregar ${S.entryNoun}</button></div>
      <div class="tscroll"><table><thead><tr>${head}</tr></thead><tbody>${body||''}</tbody></table></div>
      ${c.L.length?'':'<p class="hint" style="margin-top:12px">Sin registros todavía. Tocá “Agregar”.</p>'}</div>`;
  }
  function bindTable(){
    const box=$('#viewbox');
    box.addEventListener('input',onEdit); box.addEventListener('change',onEdit);
    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.entries.splice(+b.dataset.del,1);save();drawView(compute());refreshHeader();});
    const add=box.querySelector('[data-add]'); if(add) add.onclick=()=>{state.entries.push(S.blank?S.blank():{});save();drawView(compute());refreshHeader();};
  }
  function onEdit(ev){
    const t=ev.target; if(t.dataset.i==null)return;
    const i=+t.dataset.i, k=t.dataset.key;
    state.entries[i][k]=t.value; save();
    const e=enrichOne(state.entries[i]);
    S.columns.filter(co=>co.role==='calc').forEach(co=>{
      const td=document.getElementById('c-'+i+'-'+cssK(co.key)); if(!td)return;
      const cv=(e._s.calc||{})[co.key];
      if(co.key.toLowerCase().includes('semáforo')||co.key==='Recomendación')
        td.innerHTML=`<span class="chip ${e._s.semaforo||'green'}">${cv!=null?cv:'—'}</span>`;
      else td.textContent=cv!=null?cv:'—';
    });
    refreshHeader();
  }

  // ---------- MOTOR ----------
  function vMotor(){
    const rows=S.motor.map(m=>`<div class="mrow"><div class="vbl">${m[1]}<div class="hint" style="margin:2px 0 0;font-weight:400">${m[0]}</div></div>
      <div><div class="fml"><code>${m[2]}</code></div><div class="hint" style="margin:4px 0 0">${m[4]||''}</div></div>
      <div class="peso">${m[3]}</div></div>`).join('');
    return `<div class="card"><h2>Motor de cálculo</h2>
      <p class="hint">Reglas que convierten tus registros en puntaje y semáforo. Documentación de la hoja <b>Motor</b>.</p>
      ${rows}</div>`;
  }

  // ---------- ALERTAS ----------
  function vAlertas(c){
    const rows=(c.agg.alertas||[]).map(a=>{
      const sem=a.active?(a.nivel==='Alta'?'red':'yellow'):'green';
      return `<div class="arow"><div class="nv sem-${sem}">${a.nivel}</div>
        <div class="body"><h4>${a.area}</h4><p>${a.reco}</p></div>
        <div><span class="chip ${sem}">${a.result}</span></div></div>`;
    }).join('');
    return `<div class="card"><h2>Alertas y recomendaciones</h2>
      <p class="hint">Señales que decide el coach según tus datos. Verde = bajo control.</p>${rows||'<p class="hint">Sin alertas definidas.</p>'}</div>`;
  }

  // ---------- GUIA ----------
  function vGuia(c){
    const steps=S.guide.map(s=>`<div class="step"><div class="n"></div><p>${s}</p></div>`).join('');
    return `<div class="card"><h2>Cómo usar este coach</h2><div class="steps">${steps}</div></div>
      <div class="card"><h2>Contexto para Claude</h2><p class="hint">Copiá esto para que Claude opere este coach con tus datos.</p>
        <div class="note">${S.claude}</div>
        <div class="row-actions" style="margin-top:14px">
          <button class="btn sm" data-exp="row">Copiar fila Export</button>
          <button class="btn sm ghost" data-exp="json">Descargar JSON completo</button>
        </div></div>`;
  }
  function bindExport(c){ $('#viewbox').querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>doExport(b.dataset.exp)); }
  function doExport(kind){
    const c=compute();try{if(window.parent&&window.parent!==window)window.parent.postMessage({__flowin:"state",payload:c.exportRow},"*");}catch(e){}
    if(kind==='row'){ copy(JSON.stringify(c.exportRow,null,2)); toast('Fila Export copiada'); }
    else if(kind==='json'){ dl(S.num+'_'+S.id+'.json', JSON.stringify({coach:S.id,config:state.cfg,export:c.exportRow,entradas:state.entries},null,2)); }
    else if(kind==='csv'){
      const cols=S.columns.map(co=>co.key);
      const lines=[cols.join(',')].concat(c.L.map(e=>cols.map(k=>{
        let v=(co=>{const cc=S.columns.find(x=>x.key===k);return cc&&cc.role==='calc'?((e._s.calc||{})[k]):e[k];})();
        v=v==null?'':String(v).replace(/"/g,'""'); return /[,"\n]/.test(v)?'"'+v+'"':v;
      }).join(',')));
      dl(S.num+'_'+S.id+'_entradas.csv', lines.join('\n'));
    }
  }

  function refreshHeader(){
    const c=compute();try{if(window.parent&&window.parent!==window)window.parent.postMessage({__flowin:"state",payload:c.exportRow},"*");}catch(e){}
    const hs=document.getElementById('hScore'); if(hs)hs.textContent=H.R(c.agg.puntaje);
    const he=document.getElementById('hEstado'); if(he){he.textContent=c.est.label;he.className='sem-'+c.est.sem;he.style.fontWeight=700;
      const dot=he.previousElementSibling; if(dot)dot.className='dot bg-'+c.est.sem;}
  }

  // helpers
  function cssK(k){return k.replace(/[^a-zA-Z0-9]/g,'_');}
  function escA(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
  function copy(t){try{navigator.clipboard.writeText(t);}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}}
  function dl(name,txt){const b=new Blob([txt],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);toast('Descargado '+name);}
  let tt; function toast(m){const e=document.getElementById('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800);}

  render();
})();
</script></body></html>
