<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Coach App</title>
<style>
:root{
  --bg:#0b0e14; --bg2:#0d1117; --card:#151b24; --card2:#1b222d; --line:#262e3a;
  --txt:#e6edf3; --mut:#8b97a7; --mut2:#5d6776;
  --accent:#6aa6ff; --accent-soft:rgba(106,166,255,.14);
  --green:#3fb950; --yellow:#d8a236; --red:#f3604b;
  --radius:16px; --sh:0 10px 30px rgba(0,0,0,.35);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 700px at 85% -10%,rgba(106,166,255,.07),transparent 60%),
     radial-gradient(900px 600px at -10% 110%,var(--accent-soft),transparent 55%),var(--bg);
     color:var(--txt);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.45}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.badge{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent);flex:none}
.htitle{display:flex;flex-direction:column;gap:3px}
.htitle .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);font-weight:600}
.htitle h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.areachip{font-size:12px;color:var(--accent);background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);padding:3px 9px;border-radius:999px;font-weight:600}
.spacer{flex:1}
.livebox{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:8px 14px;box-shadow:var(--sh)}
.livebox .num{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.livebox .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.sem-green{color:var(--green)} .sem-yellow{color:var(--yellow)} .sem-red{color:var(--red)}
.bg-green{background:var(--green)} .bg-yellow{background:var(--yellow)} .bg-red{background:var(--red)}
.subtitle{color:var(--mut);font-size:13.5px;margin:0 0 18px;max-width:760px}
/* layout */
.shell{display:grid;grid-template-columns:208px 1fr;gap:20px;align-items:start}
.nav{position:sticky;top:18px;display:flex;flex-direction:column;gap:4px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--sh)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;
  border:0;color:var(--mut);font:inherit;font-size:14px;font-weight:600;padding:10px 12px;border-radius:11px;cursor:pointer;transition:.15s}
.nav button .ic{font-size:16px;width:20px;text-align:center}
.nav button:hover{background:var(--card2);color:var(--txt)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.view{min-width:0;display:flex;flex-direction:column;gap:16px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--sh)}
.card h2{margin:0 0 3px;font-size:15px;font-weight:700}
.card .hint{color:var(--mut);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:13px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:23px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .m{font-size:11.5px;color:var(--mut2)}
.kpi .lec{font-size:11.5px;color:var(--accent);margin-top:6px}
/* resumen hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.gauge{width:148px;height:148px;flex:none}
.gauge circle{fill:none;stroke-width:11;stroke-linecap:round}
.gauge .bg{stroke:var(--card2)}
.gauge .fg{transition:stroke-dashoffset .6s ease, stroke .3s}
.gwrap{position:relative;width:148px;height:148px}
.gtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gtext .n{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.gtext .s{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.callout{border-radius:13px;padding:14px 16px;border:1px solid var(--line);background:var(--card2)}
.callout .nivel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.callout h3{margin:5px 0 6px;font-size:16px}
.callout p{margin:0;color:var(--mut);font-size:13.5px}
.estado-pill{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;
  padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);margin-top:10px}
/* table */
.tablebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{background:var(--accent);color:#06101f;border:0;font:inherit;font-weight:700;font-size:13px;
  padding:9px 14px;border-radius:10px;cursor:pointer;transition:.15s;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--line)}
.btn.sm{padding:6px 10px;font-size:12px}
.tscroll{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
thead th{position:sticky;top:0;background:var(--card2);color:var(--mut);text-align:left;font-weight:600;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
tbody td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:rgba(255,255,255,.015)}
tbody input,tbody select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  font:inherit;font-size:13px;padding:7px 8px;border-radius:8px;min-width:78px}
tbody input:focus,tbody select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
td.calc{font-weight:700;font-variant-numeric:tabular-nums;color:var(--txt);white-space:nowrap}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.green{background:rgba(63,185,80,.15);color:var(--green)}
.chip.yellow{background:rgba(216,162,54,.16);color:var(--yellow)}
.chip.red{background:rgba(243,96,75,.15);color:var(--red)}
.del{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;cursor:pointer;
  width:30px;height:30px;font-size:15px;line-height:1}
.del:hover{border-color:var(--red);color:var(--red)}
/* config */
.cfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  font:inherit;padding:10px 11px;border-radius:10px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.field .fh{font-size:11.5px;color:var(--mut2);margin-top:5px}
/* motor / alerts / guia */
.mrow,.arow{display:grid;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}
.mrow{grid-template-columns:120px 1fr 64px}
.mrow:last-child,.arow:last-child{border-bottom:0}
.mrow .vbl{font-weight:700}.mrow .fml{color:var(--mut);font-size:13px}
.mrow .peso{font-weight:800;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.arow{grid-template-columns:84px 1fr auto}
.arow .nv{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;align-self:center}
.arow .body h4{margin:0 0 3px;font-size:14px}
.arow .body p{margin:0;color:var(--mut);font-size:13px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:11px}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.step .n{counter-increment:s;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  font-weight:800;display:grid;place-items:center;font-size:14px}
.step .n::before{content:counter(s)}
.step p{margin:0;font-size:13.5px;color:var(--txt)}
.exp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 14px}
.exp .e{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.exp .e .k{font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em}
.exp .e .v{font-size:13.5px;font-weight:700;margin-top:3px;word-break:break-word}
.row-actions{display:flex;gap:9px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--accent);color:#06101f;font-weight:700;padding:11px 18px;border-radius:11px;box-shadow:var(--sh);
  transition:.25s;pointer-events:none;z-index:50;font-size:13.5px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin-top:26px;text-align:center;color:var(--mut2);font-size:12px}
.foot a{color:var(--accent)}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .nav{position:static;flex-direction:row;overflow:auto;padding:6px}
  .nav button{flex:none;white-space:nowrap}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .livebox{order:3}
}

.macrobar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:7px}
.macrobar > i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .4s}
.macros{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.mac{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.mac .l{font-size:12px;color:var(--mut);font-weight:600}
.mac .v{font-size:22px;font-weight:800;margin:3px 0;font-variant-numeric:tabular-nums}
.mac .s{font-size:11.5px;color:var(--mut2)}
.week{display:grid;gap:10px}
.day{display:grid;grid-template-columns:120px 1fr;gap:14px;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.day .dn{font-weight:800}.day .de{font-size:12.5px;color:var(--accent);font-weight:700}
.day .dd{color:var(--mut);font-size:13px;margin-top:3px}
.day .meta{font-size:11.5px;color:var(--mut2);margin-top:6px}
.meal{margin-bottom:16px}
.meal h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.meal h4 .mt{font-size:12px;color:var(--mut);font-weight:600}
.spark{width:100%;height:60px}
@media(max-width:720px){.day{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>

 function macros(){
  const p=st.perfil, kg=N(p.Peso), cm=N(p.Estatura), age=N(p.Edad);
  const tmb=(p.Sexo==='Femenino')?(10*kg+6.25*cm-5*age-161):(10*kg+6.25*cm-5*age+5);
  const af=(DATA.actividad.find(a=>a.nivel===p.Actividad)||{factor:1.55}).factor;
  const mant=tmb*af;
  const ob=DATA.objetivos.find(o=>o.obj===p.Objetivo)||DATA.objetivos[0];
  const cal=mant+N(ob.calAdj);
  const prot=kg*N(ob.protKg), grasa=kg*N(ob.grasaKg);
  const carbs=Math.max((cal-prot*4-grasa*9)/4,0);
  const fibra=R(cal/1000*14), agua=+(kg*0.035).toFixed(1);
  return {tmb,af,mant,cal,prot,grasa,carbs,fibra,agua,ob};
 }
 function base100(porc){const m=String(porc).match(/(\d+)/);return m?N(m[1]):100;}
 function foodBy(n){return DATA.alimentos.find(a=>a.nombre===n);}
 function planTotals(){
  let t={kcal:0,prot:0,carb:0,grasa:0,fibra:0,costo:0};
  Object.values(st.plan).forEach(items=>items.forEach(([n,g])=>{
    const f=foodBy(n); if(!f)return; const k=N(g)/base100(f.porcion);
    t.kcal+=N(f.kcal)*k;t.prot+=N(f.prot)*k;t.carb+=N(f.carb)*k;t.grasa+=N(f.grasa)*k;t.fibra+=N(f.fibra)*k;t.costo+=N(f.costo)*k;
  })); return t;
 }

     <div class="mac"><div class="l">Mantenimiento</div><div class="v">${fmt(m.mant)}</div><div class="s">×${m.af} actividad</div></div>
     <div class="mac"><div class="l">Calorías objetivo</div><div class="v" style="color:var(--accent)">${fmt(m.cal)}</div><div class="s">ajuste ${m.ob.calAdj>0?'+':''}${m.ob.calAdj}</div></div>
     <div class="mac"><div class="l">Proteína</div><div class="v">${R(m.prot)} g</div><div class="s">${m.ob.protKg} g/kg</div></div>
     <div class="mac"><div class="l">Grasa</div><div class="v">${R(m.grasa)} g</div><div class="s">${m.ob.grasaKg} g/kg</div></div>
     <div class="mac"><div class="l">Carbohidratos</div><div class="v">${R(m.carbs)} g</div><div class="s">resto de calorías</div></div>
     <div class="mac"><div class="l">Fibra mínima</div><div class="v">${m.fibra} g</div><div class="s">~14 g/1000 kcal</div></div>
     <div class="mac"><div class="l">Agua guía</div><div class="v">${m.agua} L</div><div class="s">35 ml/kg</div></div>
    </div></div>`;
 }
 // Guarda mientras tipeás, pero recalcula el plan recién al confirmar el campo
 // (change/blur): evita planes absurdos con valores a medio escribir ("1", "18").
 function bindPerfil(){$('#vb').querySelectorAll('[data-p]').forEach(el=>{
   const apply=()=>{st.perfil[el.dataset.p]=el.value; save();};
   if(el.tagName==='SELECT'){ el.addEventListener('change',()=>{apply();render();}); }
   else { el.addEventListener('input',apply); el.addEventListener('change',()=>{apply();render();}); }
 });}

 // RUTINA
 function vRutina(){
  let dias=N(st.perfil.DiasPesas); dias=Math.max(3,Math.min(6,dias));
  const rows=DATA.rutinas.filter(r=>r.obj===st.perfil.Objetivo && N(r.dias)===dias);

    <div><div class="dd">💪 ${r.ejercicios||''}</div><div class="dd">🏃 Cardio: ${r.cardio||'—'}</div><div class="meta">📝 ${r.notas||''}</div></div></div>`).join('');

     <div class="mac"><div class="l">Descanso</div><div class="v" style="font-size:15px">${pr.desc}</div></div>
     <div class="mac"><div class="l">RIR objetivo</div><div class="v" style="font-size:15px">${pr.rir}</div></div>
     <div class="mac"><div class="l">Progresión</div><div class="v" style="font-size:13.5px">${pr.prog}</div></div>

    </div></div>`;
 }

 // COMIDA
 function vComida(m){
  const comidas=['Desayuno','Almuerzo','Snack','Cena','Comida 5','Comida 6'].slice(0,N(st.perfil.Comidas));
  comidas.forEach(c=>{if(!st.plan[c])st.plan[c]=[];});
  const t=planTotals();
  const list=DATA.alimentos.map(a=>`<option value="${a.nombre}">`).join('');
  const bar=(lbl,cons,obj,unit)=>{const pct=obj>0?Math.min(cons/obj*100,140):0;
    return `<div class="mac"><div class="l">${lbl}</div><div class="v" style="font-size:18px">${R(cons)}<span style="font-size:12px;color:var(--mut2)"> / ${R(obj)} ${unit}</span></div>
      <div class="macrobar"><i style="width:${Math.min(pct,100)}%;background:${pct>110?'var(--red)':pct>=90?'var(--green)':'var(--accent)'}"></i></div></div>`;};
  const meals=comidas.map(c=>{
    const items=(st.plan[c]||[]).map((it,i)=>{const f=foodBy(it[0]);const k=N(it[1])/(f?base100(f.porcion):100);
      const kc=f?R(N(f.kcal)*k):0, pr=f?R(N(f.prot)*k):0;
      return `<tr><td><input list="foods" data-m="${c}" data-i="${i}" data-f="n" value="${it[0]||''}" placeholder="Alimento"></td>
        <td><input type="number" step="any" data-m="${c}" data-i="${i}" data-f="g" value="${it[1]||''}" style="max-width:90px"> g</td>
        <td class="calc">${kc} kcal</td><td class="calc">${pr} P</td>
        <td><button class="del" data-delm="${c}" data-deli="${i}">✕</button></td></tr>`;}).join('');
    return `<div class="meal"><h4>${c} <button class="btn sm ghost" data-addm="${c}">+ alimento</button></h4>
      <div class="tscroll"><table><tbody>${items||'<tr><td class="hint" style="padding:10px">Sin alimentos</td></tr>'}</tbody></table></div></div>`;
  }).join('');
  return `<datalist id="foods">${list}</datalist>
   <div class="card"><h2>Resumen del día</h2><p class="hint">Comparado con tus objetivos calculados.</p>
    <div class="macros">${bar('Calorías',t.kcal,m.cal,'kcal')}${bar('Proteína',t.prot,m.prot,'g')}${bar('Carbohidratos',t.carb,m.carbs,'g')}${bar('Grasa',t.grasa,m.grasa,'g')}${bar('Fibra',t.fibra,m.fibra,'g')}
     <div class="mac"><div class="l">Costo diario</div><div class="v" style="font-size:18px">₡${fmt(t.costo)}</div><div class="s">aprox según base</div></div></div></div>
   <div class="card"><h2>Planificador de comidas</h2><p class="hint">Elegí alimento (autocompleta) y gramos. Los macros se calculan solos.</p>${meals}</div>`;
 }
 function bindComida(){const b=$('#vb');
  b.addEventListener('input',e=>{const t=e.target;if(!t.dataset.m)return;const c=t.dataset.m,i=+t.dataset.i;
    if(t.dataset.f==='n')st.plan[c][i][0]=t.value; else st.plan[c][i][1]=t.value; save();
    if(t.dataset.f==='n')draw(macros()); else draw(macros());});
  b.querySelectorAll('[data-addm]').forEach(x=>x.onclick=()=>{const c=x.dataset.addm;st.plan[c]=st.plan[c]||[];st.plan[c].push(['',100]);save();draw(macros());});
  b.querySelectorAll('[data-delm]').forEach(x=>x.onclick=()=>{st.plan[x.dataset.delm].splice(+x.dataset.deli,1);save();draw(macros());});
 }

 // ENTRENOS
 function vEntrenos(){
  const ej=DATA.ejercicios.map(e=>`<option value="${e.nombre}">`).join('');
  let vol=0,rpe=[],cnt=st.entrenos.length;
  const rows=st.entrenos.map((r,i)=>{
    let v=0;for(let s=1;s<=4;s++)v+=N(r['k'+s])*N(r['r'+s]); vol+=v; if(r.rpe)rpe.push(N(r.rpe));
    return `<tr><td><input type="date" data-i="${i}" data-k="fecha" value="${r.fecha||''}"></td>
     <td><input list="ejs" data-i="${i}" data-k="ej" value="${r.ej||''}" placeholder="Ejercicio"></td>
     ${[1,2,3,4].map(s=>`<td><input type="number" step="any" data-i="${i}" data-k="k${s}" value="${r['k'+s]||''}" style="max-width:62px" placeholder="kg"></td>
       <td><input type="number" step="any" data-i="${i}" data-k="r${s}" value="${r['r'+s]||''}" style="max-width:54px" placeholder="r"></td>`).join('')}
     <td><input type="number" step="any" data-i="${i}" data-k="rpe" value="${r.rpe||''}" style="max-width:54px"></td>
     <td class="calc">${R(v)}</td><td><button class="del" data-del="${i}">✕</button></td></tr>`;}).join('');
  const rpeAvg=rpe.length?(rpe.reduce((a,b)=>a+b,0)/rpe.length).toFixed(1):'—';
  return `<datalist id="ejs">${ej}</datalist>
   <div class="card"><div class="tablebar"><div><h2 style="margin:0">Registro de entrenamiento</h2><p class="hint" style="margin:2px 0 0">Volumen = Σ(kg × reps). ${cnt} sesiones · volumen total ${fmt(vol)} kg · RPE prom ${rpeAvg}</p></div>
     <button class="btn" data-add="1">+ Set</button></div>
    <div class="tscroll"><table><thead><tr><th>Fecha</th><th>Ejercicio</th><th>S1 kg</th><th>r</th><th>S2 kg</th><th>r</th><th>S3 kg</th><th>r</th><th>S4 kg</th><th>r</th><th>RPE</th><th>Vol</th><th></th></tr></thead>
     <tbody>${rows||''}</tbody></table></div>
    ${cnt?'':'<p class="hint" style="margin-top:10px">Sin sesiones. Tocá “+ Set”.</p>'}</div>`;
 }
 function bindEntrenos(){const b=$('#vb');
  b.addEventListener('input',e=>{const t=e.target;if(t.dataset.i==null)return;st.entrenos[+t.dataset.i][t.dataset.k]=t.value;save();
    let v=0;const r=st.entrenos[+t.dataset.i];for(let s=1;s<=4;s++)v+=N(r['k'+s])*N(r['r'+s]);
    const td=t.closest('tr').querySelector('td.calc');if(td)td.textContent=R(v);});
  b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{st.entrenos.splice(+x.dataset.del,1);save();draw(macros());});
  const a=b.querySelector('[data-add]');if(a)a.onclick=()=>{st.entrenos.push({fecha:TODAY()});save();draw(macros());};
 }

 // CUERPO
 const CC=[['fecha','Fecha','date'],['peso','Peso kg','number'],['cintura','Cintura cm','number'],['pecho','Pecho cm','number'],
   ['brazo','Brazo cm','number'],['pierna','Pierna cm','number'],['sueno','Sueño h','number'],['pasos','Pasos','number'],
   ['agua','Agua L','number'],['adher','Adher. %','number'],['energia','Energía 1-5','number'],['nota','Nota','text']];
 function vCuerpo(){
  const rows=st.cuerpo.map((r,i)=>`<tr>${CC.map(c=>`<td><input type="${c[2]}" step="any" data-i="${i}" data-k="${c[0]}" value="${r[c[0]]||''}" style="${c[2]==='text'?'':'max-width:88px'}"></td>`).join('')}<td><button class="del" data-del="${i}">✕</button></td></tr>`).join('');
  const ws=st.cuerpo.map(r=>N(r.peso)).filter(x=>x>0);
  return `<div class="card"><div class="tablebar"><div><h2 style="margin:0">Registro corporal y hábitos</h2><p class="hint" style="margin:2px 0 0">Pesate 3–7 veces/semana de forma consistente.</p></div><button class="btn" data-add="1">+ Registro</button></div>
    <div class="tscroll"><table><thead><tr>${CC.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows||''}</tbody></table></div></div>
   <div class="card"><h2>Tendencia de peso</h2>${spark(ws)}</div>`;
 }
 function spark(arr){
  if(arr.length<2)return '<p class="hint">Registrá al menos 2 pesos para ver la tendencia.</p>';
  const w=560,h=60,mn=Math.min(...arr),mx=Math.max(...arr),rg=(mx-mn)||1;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1))*w},${h-((v-mn)/rg)*h}`).join(' ');
  const chg=(arr[arr.length-1]-arr[0]).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts}"/></svg>
   <p class="hint" style="margin-top:8px">De ${arr[0]} a ${arr[arr.length-1]} kg · cambio <b style="color:${chg<0?'var(--green)':chg>0?'var(--yellow)':'var(--mut)'}">${chg>0?'+':''}${chg} kg</b></p>`;
 }
 function bindCuerpo(){const b=$('#vb');
  b.addEventListener('input',e=>{const t=e.target;if(t.dataset.i==null)return;st.cuerpo[+t.dataset.i][t.dataset.k]=t.value;save();});
  b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{st.cuerpo.splice(+x.dataset.del,1);save();draw(macros());});
  const a=b.querySelector('[data-add]');if(a)a.onclick=()=>{st.cuerpo.push({fecha:TODAY()});save();draw(macros());};
 }

 // DASH
 function vDash(m){
  const ws=st.cuerpo.map(r=>N(r.peso)).filter(x=>x>0);
  const first=ws[0]||0,last=ws[ws.length-1]||0,chg=ws.length?(last-first):0;
  const avg7=ws.length?(ws.slice(-7).reduce((a,b)=>a+b,0)/Math.min(ws.length,7)):0;
  let vol=0,rpe=[];st.entrenos.forEach(r=>{for(let s=1;s<=4;s++)vol+=N(r['k'+s])*N(r['r'+s]);if(r.rpe)rpe.push(N(r.rpe));});
  const rpeAvg=rpe.length?rpe.reduce((a,b)=>a+b,0)/rpe.length:0;
  const adh=st.cuerpo.map(r=>N(r.adher)).filter(x=>x>0);
  const adhAvg=adh.length?adh.reduce((a,b)=>a+b,0)/adh.length:0;
  const cintura=st.cuerpo.map(r=>N(r.cintura)).filter(x=>x>0);
  const dec=[
   ['Peso estancado','Bajar/subir pero sin cambio 2 sem','Ajustá 100-150 kcal', (ws.length>=4&&Math.abs(chg)<0.3)?'Atención':(ws.length<4?'Sin datos':'OK')],
   ['RPE alto','RPE promedio > 8.5','Reducí volumen 10-20% o deload', (rpeAvg>8.5?'Atención':(rpe.length?'OK':'Sin datos'))],
   ['Adherencia baja','Adherencia < 80%','Simplificá comidas antes de tocar plan', (adh.length?(adhAvg<80?'Atención':'OK'):'Sin datos')],
   ['Cintura sube','Posible superávit alto','Bajá 100 kcal o reducí grasas', (cintura.length>=2?(cintura[cintura.length-1]>cintura[0]?'Atención':'OK'):'Sin datos')],
  ];
  const drows=dec.map(d=>{const cl=d[3]==='Atención'?'yellow':d[3]==='OK'?'green':'red';
    return `<div class="arow"><div class="nv sem-${cl}">${d[3]}</div><div class="body"><h4>${d[0]}</h4><p>${d[1]} → ${d[2]}</p></div><div><span class="chip ${cl}">${d[3]}</span></div></div>`;}).join('');
  return `<div class="card"><h2>Indicadores</h2><div class="grid kpis">
     <div class="kpi"><div class="l">Peso inicial</div><div class="v">${first||'—'}</div><div class="m">kg</div></div>
     <div class="kpi"><div class="l">Último peso</div><div class="v">${last||'—'}</div><div class="m">kg</div></div>
     <div class="kpi"><div class="l">Cambio total</div><div class="v">${chg?((chg>0?'+':'')+chg.toFixed(1)):'0'}</div><div class="m">kg</div></div>
     <div class="kpi"><div class="l">Promedio 7</div><div class="v">${avg7?avg7.toFixed(1):'—'}</div><div class="m">kg</div></div>
     <div class="kpi"><div class="l">Volumen total</div><div class="v">${fmt(vol)}</div><div class="m">kg acumulados</div></div>
     <div class="kpi"><div class="l">RPE promedio</div><div class="v">${rpeAvg?rpeAvg.toFixed(1):'—'}</div><div class="m">/10</div></div>
     <div class="kpi"><div class="l">Adherencia</div><div class="v">${adhAvg?R(adhAvg)+'%':'—'}</div><div class="m">dieta</div></div>
     <div class="kpi"><div class="l">Calorías objetivo</div><div class="v">${fmt(m.cal)}</div><div class="m">kcal</div></div>
   </div></div>
   <div class="card"><h2>Decisiones automáticas</h2><p class="hint">Reglas del coach evaluadas con tus registros.</p>${drows}</div>`;
 }

 let tt;function toast(m){const e=$('#toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1600);}
 render();
})();
